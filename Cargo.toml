[package]
name = "waddle"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.4"
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.12.1"
poise = "0.7.0"
rand = "0.10.2"
serde_json = "1.0.140"
sha2 = "0.10.9"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["net", "rt-multi-thread", "sync"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
redundant_clone = "warn"
print_stdout = "warn"
